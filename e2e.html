<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>e2e</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <script>
    // THROWAWAY test harness (deleted before finishing): ?p=xbox|ipad|computer&s=scenario
    const q = new URLSearchParams(location.search);
    document.addEventListener('DOMContentLoaded', () => { document.body.dataset.platform = q.get('p') || 'computer'; });
  </script>
</head>
<body>
  <div id="app"></div><div id="ui"></div><div id="boot">boot</div>
  <pre id="result" style="position:fixed;left:0;top:0;z-index:999;margin:0;padding:6px;background:#000;color:#0f0;font-size:11px;max-width:60vw;white-space:pre-wrap;pointer-events:none"></pre>
  <script type="module">
    document.body.dataset.platform = new URLSearchParams(location.search).get('p') || 'computer';
    if (['rebind1', 'xboxsizes', 'ipad', 'computer'].includes(new URLSearchParams(location.search).get('s'))) localStorage.clear();
    await import('./src/main.js');
    const g = window.__game, q = new URLSearchParams(location.search), sc = q.get('s');
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const out = { scenario: sc };
    const show = () => { document.getElementById('result').textContent = JSON.stringify(out, null, 1); document.title = 'DONE ' + sc; };
    window.__tick = (n = 1, dt = 0.05) => { for (let i = 0; i < n; i++) { g.hub.poll(dt); g.mode === 'title' ? g.updateTitle(dt) : g.updatePlay(dt); } };
    window.__mk = (i) => ({ index: i, id: 'Xbox Controller (STANDARD GAMEPAD)', mapping: 'standard', connected: true, timestamp: 0, buttons: Array.from({ length: 17 }, () => ({ pressed: false, value: 0, touched: false })), axes: [0, 0, 0, 0] });
    window.__pads = [0, 1, 2, 3].map(window.__mk); navigator.getGamepads = () => window.__pads.slice();
    window.__btn = (i, b, down) => { if (window.__pads[i]) window.__pads[i].buttons[b] = { pressed: down, value: down ? 1 : 0, touched: down }; };
    window.__press = (i, b, frames = 2) => { window.__btn(i, b, true); window.__tick(frames); window.__btn(i, b, false); window.__tick(2); };
    try {
      if (sc === 'rebind1') { // phase 1: fresh save, 4 players, give P3 and P4 distinct items, save
        localStorage.clear();
        window.__tick(3); for (let i = 0; i < 4; i++) window.__press(i, 9);
        out.joined = g.seats.length; window.__press(0, 0); await sleep(100); window.__tick(5);
        g.slots[2].inv.add('oak_log', 23); g.slots[3].inv.add('diamond', 3);
        g.save(); const sv = JSON.parse(localStorage.getItem('oneblock3d.xbox.save.v2')); out.saved = sv.seats.map((s) => s && s.pad && s.pad.index);
        g.save = () => false; out.next = 'rebind2';
      } else if (sc === 'rebind2') { // phase 2: after reload only pads 3 and 0 attend; pad 3 joins first and must be offered P4
        out.slots = g.slots.map((s) => [s.hasData, s.padId && s.padId.index]);
        window.__pads[1] = null; window.__pads[2] = null; window.__tick(3);
        window.__press(3, 9);
        out.pickers = g.pickers.map((p) => ({ pad: p.src.index, sel: p.sel }));
        out.pickerText = document.querySelector('.pickers').textContent;
        g.renderer.render(0.016);
        // pad 3 confirms its preselected slot (identity match = P4)
        window.__press(3, 0);
        out.afterConfirm = g.seats.map((s) => [s.name, s.input.index, s.inv.count('diamond'), s.inv.count('oak_log')]);
        // pad 0 joins and moves the selection with D-pad right then confirms
        window.__press(0, 9); out.p0pick = g.pickers.map((p) => p.sel);
        window.__press(0, 15); out.p0sel = g.pickers.map((p) => p.sel); window.__press(0, 0);
        out.final = g.seats.map((s) => [s.name, s.input.index, s.inv.count('diamond'), s.inv.count('oak_log')]);
        g.save = () => false;
      }
      else if (sc === 'ipad') {
        localStorage.clear(); g.newWorld(); [...document.querySelectorAll('.titlemenu .btn')][0].click(); await sleep(250);
        const P = (type, target, id = 1) => target.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerType: 'touch', pointerId: id, isPrimary: true }));
        const tap = (el, id) => { P('pointerdown', el, id); P('pointerup', el, id); };
        const T = (target) => { const e = new Event('touchmove', { bubbles: true, cancelable: true }); target.dispatchEvent(e); return e.defaultPrevented; };
        const s = g.seats[0]; out.vp = [innerWidth, innerHeight];
        g.inv.add('oak_log', 6); g.inv.add('stick', 1); window.__tick(3);
        out.canvasPrevented = T(g.canvas);
        tap(document.querySelector('.tbtn[data-action=inventory]'), 5); window.__tick(3);
        const bl = document.querySelector('.seathud .booklist');
        out.invOpen = s.ui.current; out.bookScrolls = bl.scrollHeight > bl.clientHeight; out.bookTouchAction = getComputedStyle(bl).touchAction; out.bookOverscroll = getComputedStyle(bl).overscrollBehaviorY;
        out.bookTouchmovePrevented = T(bl.querySelector('.recipe') || bl);
        out.phaseDisplay = getComputedStyle(document.querySelector('.ghud .phase')).display;
        const wr = s.ui.win.root.getBoundingClientRect(); out.winWithin = wr.left >= 0 && wr.right <= innerWidth && wr.top >= 0 && wr.bottom <= innerHeight; out.winRect = [wr.left, wr.top, wr.right, wr.bottom].map(Math.round);
        out.tip = (() => { const t = document.querySelector('.seathud .touchtip'); return t && getComputedStyle(t).display !== 'none' ? t.textContent : 'hidden'; })();
        const row = (n) => [...document.querySelectorAll('.seathud .recipe')].find((r) => r.querySelector('.rname').textContent.trim() === n);
        // two quick taps on two DIFFERENT recipes must not craft the max
        const before = g.inv.count('oak_log');
        tap(row('Oak Planks'), 6); tap(row('Stick'), 7); window.__tick(1);
        out.twoDifferent = { logs: g.inv.count('oak_log'), planks: g.inv.count('oak_planks'), sticks: g.inv.count('stick'), logsBefore: before };
        await sleep(400);
        // double-tap the same recipe -> max
        tap(row('Oak Planks'), 8); tap(row('Oak Planks'), 9); window.__tick(1);
        out.sameDouble = { logs: g.inv.count('oak_log'), planks: g.inv.count('oak_planks') };
        // double-tap quick-move on a hotbar slot
        const hb = [...document.querySelectorAll('.seathud .window .slot')].filter((e) => e._slot && e._slot.group === 'hotbar' && e._slot.get());
        const first = hb[0]; const key = first._slot.get().key; await sleep(400);
        tap(first, 10); tap(first, 11); window.__tick(1);
        out.quickMove = { key, hotbarHas: g.inv.slots.slice(0, 9).some((x) => x && x.key === key), mainHas: g.inv.slots.slice(9).some((x) => x && x.key === key), cursor: !!s.ui.cursor };
        s.ui.close(); window.__tick(2);
        s.ui.open('goals'); window.__tick(2);
        const gl = document.querySelector('.seathud .goallist');
        out.goals = { scrolls: gl.scrollHeight > gl.clientHeight, touchAction: getComputedStyle(gl).touchAction, prevented: T(gl.firstChild) };
        s.ui.close(); window.__tick(2);
        // settings sliders
        s.ui.close(); g.openPause(s); window.__tick(2); [...document.querySelectorAll('#ui > .screen .btn')].find((b) => /Settings/.test(b.textContent)).click();
        const rg = document.querySelector('#ui > .screen input[type=range]'); const rr = rg.getBoundingClientRect();
        out.slider = { h: Math.round(rr.height), w: Math.round(rr.width), preventedOnSlider: T(rg), menuPrevented: T(document.querySelector('#ui > .screen .menu')) };
        g.ui.back(); g.ui.close(); window.__tick(2);
        // hotbar vs touch buttons overlap
        const hbr = document.querySelector('[data-ob-hotbar]').getBoundingClientRect();
        out.hotbarVsButtons = [...document.querySelectorAll('.tbtn')].filter((b) => { const r = b.getBoundingClientRect(); return !(r.right < hbr.left || r.left > hbr.right || r.bottom < hbr.top || r.top > hbr.bottom); }).map((b) => b.dataset.action);
        out.hotbarRect = [hbr.left, hbr.right].map(Math.round);
      }
      else if (sc === 'computer') {
        localStorage.clear(); g.newWorld(); g.startPlaying(); await sleep(400); g.ui.close(true); g.hub.pointerLocked = true; g.noLock = true;
        const key = (code, type = 'keydown') => window.dispatchEvent(new KeyboardEvent(type, { code, bubbles: true }));
        const s = g.seats[0]; out.platform = g.platform.key; out.src = s.input.kind;
        window.__tick(2);
        g.canvas.dispatchEvent(new MouseEvent('mousedown', { button: 0, bubbles: true }));
        let n = 0; while (g.state.blocksBroken < 5 && n++ < 3000) window.__tick(1);
        window.dispatchEvent(new MouseEvent('mouseup', { button: 0 })); window.__tick(20);
        out.afterMine = g.inv.slots.filter(Boolean).map((x) => x.key + 'x' + x.n);
        key('KeyE'); key('KeyE', 'keyup'); window.__tick(2); out.open = s.ui.current;
        const click = (name, shift = false) => { const r = [...document.querySelectorAll('.seathud .recipe')].find((r) => r.querySelector('.rname').textContent.trim() === name); if (!r) return false; r.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, shiftKey: shift, button: 0, pointerType: 'mouse' })); return true; };
        out.winCloseHidden = getComputedStyle(document.querySelector('.seathud .winclose')).display;
        out.filter = s.ui.bookFilter; click('Oak Planks', true); click('Crafting Table'); window.__tick(1);
        key('KeyE'); key('KeyE', 'keyup'); window.__tick(3); out.closed = s.ui.current;
        s.sel = g.inv.slots.findIndex((x) => x && x.key === 'crafting_table'); g.player.yaw = 0; g.player.pitch = -1.3; window.__tick(3);
        g.canvas.dispatchEvent(new MouseEvent('mousedown', { button: 2, bubbles: true })); window.__tick(1); window.dispatchEvent(new MouseEvent('mouseup', { button: 2 })); window.__tick(3);
        out.tablePlaced = g.world.getBlock(0, 0, -1) === g.TABLE;
        g.inv.add('bed', 1); s.sel = g.inv.slots.findIndex((x) => x && x.key === 'bed'); g.world.setBlock(-1, 0, 0, 1);
        s.placeBlock({ x: -1, y: 0, z: 0, id: 1, normal: { x: 0, y: 1, z: 0 } }, { places: 'bed' });
        g.state.time = 450; s.useBed({ x: -1, y: 1, z: 0 }); out.inBed = !!s.inBed; await sleep(2200); window.__tick(2);
        out.timeAfterSleep = g.state.time; out.goals = Object.keys(g.goals.done);
        g.save(); const raw = JSON.parse(localStorage.getItem('oneblock3d.save.v1')); out.saveV = raw.v;
        const inv0 = JSON.stringify(g.inv.serialize()); g.inv.clear(); g.applySave(raw);
        out.reload = { same: JSON.stringify(g.inv.serialize()) === inv0, broken: g.state.blocksBroken, spawn: s.spawn, table: g.world.getBlock(0, 0, -1) === g.TABLE };
        // pause/resume
        g.openPause(s); window.__tick(2); out.pause = g.ui.current; g.ui.close(true); window.__tick(2); out.resumed = g.ui.current;
      }
      else if (sc === 'xboxsizes') {
        localStorage.clear();
        window.__tick(3); for (let i = 0; i < +(q.get('n') || 4); i++) window.__press(i, 9);
        window.__press(0, 0); await sleep(100); window.__tick(8);
        const px = (sel, root) => { const e = (root || document).querySelector(sel); if (!e) return null; const r = e.getBoundingClientRect(); return +(parseFloat(getComputedStyle(e).fontSize) * (r.height / (e.offsetHeight || r.height))).toFixed(1); };
        const hud = document.querySelector('.seathud[data-seat="0"]');
        out.seats = g.seats.length; out.scale = +g.seats[0].ui.scale.toFixed(2);
        out.px = { hint: px('.hintbar', hud), chip: px('.namechip', hud), hbnum: px('.hbnum', hud), heldname: px('.heldname', hud), phaseName: px('.phase .phname'), phaseInfo: px('.phase .phinfo'), tracker: px('.phase .tracker') };
        const hr = hud.querySelector('.hintbar').getBoundingClientRect(), cr = hud.querySelector('.crosshair').getBoundingClientRect();
        out.hintOverlapsCrosshair = !(hr.bottom < cr.top || hr.top > cr.bottom);
        g.renderer.render(0.016);
      }
    } catch (e) { out.error = String(e && e.stack || e); }
    show();
    if (sc === 'rebind1') setTimeout(() => { location.href = location.pathname + '?p=xbox&s=rebind2'; }, 400);
  </script>
</body>
</html>
